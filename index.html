<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramide de Maslow interactive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Pyramide de Maslow interactive</h2>

<div class="container">

  <!-- PYRAMIDE -->
  <div class="pyramid">

   <div class="level accomplishment" onmouseover="showText('accomplissement')" onclick="showText('accomplissement')">
  <span class="icon">🏆</span>
</div>

<div class="level esteem" onmouseover="showText('estime')" onclick="showText('estime')">
  <span class="icon">⭐</span>
</div>

<div class="level belonging" onmouseover="showText('appartenance')" onclick="showText('appartenance')">
  <span class="icon">👥</span>
</div>

<div class="level security" onmouseover="showText('securite')" onclick="showText('securite')">
  <span class="icon">🏠</span>
</div>

<div class="level physiological" onmouseover="showText('physio')" onclick="showText('physio')">
  <span class="icon">🧠</span>
</div>

  </div>

  <!-- TEXTE -->
  <div class="info-box" id="info">
    Passe la souris sur un niveau pour voir l’explication
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
